spring.application.name=polizas-api
server.port=8085

# H2 en memoria: los datos viven mientras la aplicacion este activa
spring.datasource.url=jdbc:h2:mem:polizasdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
# Ejecuta data.sql (datos semilla) despues de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# JSON estricto: "5" (texto) o 5.5 en un campo entero se rechazan con 400
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.accept-float-as-int=false

# API key de demostracion (solo uso local; no apta para produccion)
seguridad.api-key=123456

# CORE simulado: por defecto apunta a esta misma instancia
core.mock.base-url=http://localhost:${server.port}
